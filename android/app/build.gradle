import groovy.json.JsonSlurper
import java.io.ByteArrayOutputStream

apply plugin: 'com.android.application'

def repoRootDir = rootProject.projectDir.parentFile
def packageJson = new JsonSlurper().parse(new File(repoRootDir, 'package.json'))
def appVersion = packageJson.version.toString()

// Local and dev builds get a deterministic Git-based suffix so Android
// upgrades always move forward, while tagged clean releases keep the plain
// semantic version.
def gitCommand = { List<String> args, String fallback ->
    def stdout = new ByteArrayOutputStream()
    try {
        exec {
            commandLine(['git'] + args)
            workingDir repoRootDir
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        def output = stdout.toString('UTF-8').trim()
        output ? output : fallback
    } catch (Exception ignored) {
        fallback
    }
}

def envVersionCode = System.getenv('ANDROID_VERSION_CODE')?.trim()
def envVersionName = System.getenv('ANDROID_VERSION_NAME')?.trim()
def gitCommitCount = gitCommand(['rev-list', '--count', 'HEAD'], '1')
def gitShortSha = gitCommand(['rev-parse', '--short=7', 'HEAD'], 'unknown')
def gitTags = gitCommand(['tag', '--points-at', 'HEAD'], '').readLines()
def gitStatus = gitCommand(['status', '--porcelain'], '')
def taggedRelease = gitStatus.isEmpty() && (
        gitTags.contains(appVersion) || gitTags.contains("v${appVersion}")
)

def computedVersionCode = (envVersionCode ?: gitCommitCount).toInteger()
def computedVersionName = envVersionName ?: (
        taggedRelease ? appVersion : "${appVersion}-dev.${gitCommitCount}.${gitShortSha}"
)

android {
    namespace = "com.liureiptv.tv"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.liureiptv.tv"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName computedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Native video engine (AndroidNativePlayerPlugin): core player pulls in
    // TsExtractor (raw .ts, no extra artifact) and DefaultHttpDataSource
    // (portal auth headers/UA); the hls extension adds .m3u8. No media3-ui —
    // controls stay in the WebView, native only owns the decode surface.
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
